<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Tutorial do Jogo — 4 Fases</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="shell">
  <div class="cabinet" id="cabinet">
    <canvas id="game" width="960" height="540" aria-label="Área do jogo"></canvas>

    <div class="chip" id="chip">Fase 1: Mover</div>
    <div class="counter" id="counter">0/0</div>

    <div class="bubble" id="bubble">
      <div id="bubbleText"></div>
      <div class="hint" id="bubbleHint"></div>
      <button class="next" id="bubbleNext" type="button">Continuar ▸</button>
    </div>

    <div class="keystrip" id="keystrip"></div>

    <div class="hintBubble" id="hintBubble"><span id="hintText"></span></div>

    <div class="overlay show" id="startOverlay">
      <div class="miniflag">🚩</div>
      <h2>Tutorial do Jogo</h2>
      <p>Você vai passar por 4 fases curtas, cada uma ensinando um comando novo: mover, pular, se esconder e atirar. Preste atenção nas dicas na tela!</p>
      <button id="startBtn" type="button">Começar</button>
    </div>

    <div class="overlay" id="phaseCompleteOverlay">
      <div class="miniflag">✅</div>
      <h2 id="phaseCompleteTitle">Parabéns!</h2>
      <p id="phaseCompleteText"></p>
      <button id="phaseCompleteBtn" type="button">Próxima fase ▸</button>
    </div>

    <div class="overlay" id="gameCompleteOverlay">
      <div class="miniflag">🏆</div>
      <h2>Você completou o tutorial!</h2>
      <p>Você aprendeu a se mover, pular, se esconder e atirar. Bom jogo!</p>
      <button id="restartBtn" type="button">Jogar novamente</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
